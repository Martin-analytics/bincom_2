<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Polling Unit Results</title>
</head>
<body>
    <h2>Store New Polling Unit Results</h2>
    
    <form action="/add-results" method="POST">
        <label>Select LGA:</label>
        <select id="lga-select" name="lga_id">
            <option value="">-- Select LGA --</option>
        </select><br><br>

        <label>Select Ward:</label>
        <select id="ward-select" name="ward_id" disabled>
            <option value="">-- Select Ward --</option>
        </select><br><br>

        <label>Select Polling Unit:</label>
        <select id="pu-select" name="polling_unit_uniqueid" required disabled>
            <option value="">-- Select Polling Unit --</option>
        </select><br><br>

        <hr>
        <h3>Enter Scores</h3>
        <label>PDP:</label> <input type="number" name="PDP"><br>
        <label>DPP:</label> <input type="number" name="DPP"><br>
        <label>ACN:</label> <input type="number" name="ACN"><br>
        <br>
        <label>Your Name:</label> 
        <input type="text" name="entered_by_user" required><br><br>

        <button type="submit">Submit Results</button>
    </form>

    <script>
        const lgaSelect = document.getElementById('lga-select');
        const wardSelect = document.getElementById('ward-select');
        const puSelect = document.getElementById('pu-select');

        // 1. Load LGAs immediately when the page loads
        fetch('/api/lgas')
            .then(response => response.json())
            .then(data => {
                data.forEach(lga => {
                    lgaSelect.innerHTML += `<option value="${lga.lga_id}">${lga.lga_name}</option>`;
                });
            });

        // 2. When an LGA is selected, fetch the matching Wards
        lgaSelect.addEventListener('change', function() {
            wardSelect.innerHTML = '<option value="">-- Select Ward --</option>'; // Reset
            puSelect.innerHTML = '<option value="">-- Select Polling Unit --</option>'; // Reset
            puSelect.disabled = true;

            if (this.value) {
                wardSelect.disabled = false;
                fetch(`/api/wards/${this.value}`)
                    .then(response => response.json())
                    .then(data => {
                        data.forEach(ward => {
                            wardSelect.innerHTML += `<option value="${ward.ward_id}">${ward.ward_name}</option>`;
                        });
                    });
            } else {
                wardSelect.disabled = true;
            }
        });

        // 3. When a Ward is selected, fetch the matching Polling Units
        wardSelect.addEventListener('change', function() {
            puSelect.innerHTML = '<option value="">-- Select Polling Unit --</option>'; // Reset
            
            if (this.value) {
                puSelect.disabled = false;
                fetch(`/api/polling-units/${this.value}`)
                    .then(response => response.json())
                    .then(data => {
                        data.forEach(pu => {
                            puSelect.innerHTML += `<option value="${pu.uniqueid}">${pu.polling_unit_name}</option>`;
                        });
                    });
            } else {
                puSelect.disabled = true;
            }
        });
    </script>
</body>
</html>
